<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .leaderboard-container{
            width: 80%;
            margin: auto;
            margin-top: 50px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        th{
            background: #4a90e2;
            color: white;
            padding: 15px;
            text-align: center;
        }

        td{
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover{
            background: #f2f2f2;
        }

        .top-user{
            font-weight: bold;
            color: #2c3e50;
        }

        .dashboard-btn{
            margin-top: 30px;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="leaderboard-container">

        <h1>Leaderboard</h1>

        <table>

            <thead>

                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Books Issued</th>
                    <th>Points</th>
                </tr>

            </thead>

            <tbody id="leaderboardBody">

                <tr>
                    <td>1</td>
                    <td class="top-user">Disha</td>
                    <td>10</td>
                    <td>100</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Ravi</td>
                    <td>8</td>
                    <td>80</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Anjali</td>
                    <td>6</td>
                    <td>60</td>
                </tr>

            </tbody>

        </table>

        <div class="dashboard-btn">

            <button onclick="goDashboard()">
                Back to Dashboard
            </button>

        </div>

    </div>

<script>

function goDashboard(){

    window.location.href = "dashboard.html";

}

</script>

</body>
</html>
