<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .admin-container{
            text-align: center;
            margin-top: 50px;
        }

        .admin-buttons{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .admin-card{
            background: white;
            padding: 30px;
            width: 250px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .admin-card h2{
            margin-bottom: 15px;
            color: #333;
        }

        .admin-card p{
            color: #666;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <div class="admin-container">

        <h1>Admin Panel</h1>

        <div class="admin-buttons">

            <div class="admin-card">

                <h2>Add Books</h2>

                <p>
                    Add new books to the library database.
                </p>

                <button onclick="goAddBooks()">
                    Add Books
                </button>

            </div>

            <div class="admin-card">

                <h2>View Books</h2>

                <p>
                    View all available books in library.
                </p>

                <button onclick="goBooks()">
                    View Books
                </button>

            </div>

            <div class="admin-card">

                <h2>Dashboard</h2>

                <p>
                    Return back to dashboard page.
                </p>

                <button onclick="goDashboard()">
                    Dashboard
                </button>

            </div>

            <div class="admin-card">

                <h2>Logout</h2>

                <p>
                    Logout from admin account safely.
                </p>

                <button onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </div>

<script>

function goAddBooks(){

    window.location.href = "add_book.html";

}

function goBooks(){

    window.location.href = "books.html";

}

function goDashboard(){

    window.location.href = "dashboard.html";

}

function logout(){

    localStorage.removeItem("user");

    window.location.href = "login.html";

}

</script>

</body>
</html>
